# Roda os testes (pasta testes/) a cada envio. Se algum falhar, o GitHub avisa por e-mail.
# Não bloqueia a publicação do site: é um aviso de que algo quebrou.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node --test

  # As regras do Firebase (firebase-regras.json) no simulador do Firebase,
  # antes de colar no console.
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx -y firebase-tools@14 emulators:exec --only database --project demo-yam "node --test testes/regras-firebase.test.js"
