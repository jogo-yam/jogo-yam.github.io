# Servidor de avisos do YAM (Cloudflare Workers, plano grátis).
# Publicar: npx wrangler deploy   (a chave privada é um segredo: npx wrangler secret put VAPID_PRIVADA)
name = "yam-avisos"
main = "avisos.mjs"
compatibility_date = "2024-11-01"

# todo dia às 22h UTC (19h em Brasília): prazo de quem pausou e limpeza das salas
[triggers]
crons = ["0 22 * * *"]

[vars]
FIREBASE_DB = "https://yam-familia-default-rtdb.firebaseio.com"
